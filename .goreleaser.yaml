# Hosted downloads are the files in dist/dl (see scripts/release.sh).
# GitHub Releases upload those same files with gh; see docs/develop.md.
# This optional GoReleaser configuration does not publish releases.
version: 2
project_name: pairfob
builds:
  - id: pairfob
    main: ./cmd/pairfob
    binary: pairfob
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.ShortCommit}}
archives:
  - ids:
      - pairfob
    formats:
      - binary
    name_template: "pairfob-{{ .Os }}-{{ .Arch }}"
checksum:
  name_template: SHA256SUMS
  algorithm: sha256
snapshot:
  version_template: "{{ .ShortCommit }}"
release:
  disable: true
changelog:
  disable: true
